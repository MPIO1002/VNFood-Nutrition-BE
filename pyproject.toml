[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calcucalo-vision"
version = "0.5.0"
description = "Vietnamese food detection, segmentation and portion-estimation baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "Pillow>=10.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
inference = [
    "onnxruntime>=1.18",
    "ultralytics>=8.3",
]
onnx = ["onnxruntime>=1.18"]
api = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = [
    "onnxruntime>=1.18",
    "ultralytics>=8.3",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
calcucalo = "calcucalo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
calcucalo = ["web/*.html", "web/assets/*.css", "web/assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
