name: vnfood-nutrition

services:
  backend:
    image: python:3.11-slim
    working_dir: /workspace/backend
    command: >-
      sh -c "pip install --no-cache-dir -e '.[api]' &&
      uvicorn calcucalo.api.app:app --host 0.0.0.0 --port 8000"
    env_file:
      - ../backend/.env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ..:/workspace
