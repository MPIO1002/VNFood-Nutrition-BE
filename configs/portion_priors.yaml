# Nguồn tham khảo (Citations):
# - "Bảng thành phần thực phẩm Việt Nam" (Vietnamese Food Composition Table) - Viện Dinh Dưỡng Quốc Gia (NIN).
# - Bảng định lượng suất ăn tiêu chuẩn của Bộ Y tế & các nguồn dinh dưỡng uy tín (nhathuoclongchau, vinmec).
# - Trọng lượng một bát phở/bún tiêu chuẩn: ~500g - 600g (Bánh: 150g, Thịt: 80g, Nước: 300g).
# - Trọng lượng một đĩa cơm tấm thập cẩm tiêu chuẩn: ~350g (Cơm: 150g, Sườn: 70g, Bì chả/Trứng: 50g, Rau/Mỡ hành: 80g).
# - Trọng lượng bánh mì thịt tiêu chuẩn: ~150g - 180g.

defaults:
  default_mass_g: 200
  relative_uncertainty: 0.5
  min_mass_g: 10
  max_mass_g: 1500
  expected_fill_ratio: 0.7
  fill_ratio_uncertainty: 0.25
liquid_classes:
- Banh canh
- Bo kho
- Bun bo Hue
- Bun mam
- Bun rieu
- Canh
- Hu tieu
- Kho qua thit
- Lau
